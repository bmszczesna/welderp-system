name: Sync PM Data to Google Sheets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]
  
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Data (Historical or Current)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Fetching all historical data..."
            gh issue list --state all --limit 100 --json title,author,state,url --template '{{range .}}["Issue","{{.title}}","{{.author.login}}","{{.state}}","{{.url}}"],{{end}}' > data.json
            gh pr list --state all --limit 100 --json title,author,state,url --template '{{range .}}["PR","{{.title}}","{{.author.login}}","{{.state}}","{{.url}}"],{{end}}' >> data.json
            sed -i '$ s/,$//' data.json 
          else
            echo "Fetching current event data..."
            if [[ "${{ github.event.issue }}" != "" ]]; then
              echo '["Issue","${{ github.event.issue.title }}","${{ github.event.issue.user.login }}","${{ github.event.issue.state }}","${{ github.event.issue.html_url }}"]' > data.json
            else
              echo '["PR","${{ github.event.pull_request.title }}","${{ github.event.pull_request.user.login }}","${{ github.event.pull_request.state }}","${{ github.event.pull_request.html_url }}"]' > data.json
            fi
          fi
          
          echo "[$(cat data.json)]" > final_data.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google API dependencies
        run: pip install google-api-python-client google-auth

      - name: Append to Google Sheets using Python
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DOCUMENT_ID: ${{ secrets.DOCUMENT_ID }}
        run: |
          python -c "
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          try:
              creds_json = json.loads(os.environ['GOOGLE_CREDENTIALS'])
          except Exception as e:
              print('Проблема с секретом GOOGLE_CREDENTIALS')
              raise e
          
          creds = service_account.Credentials.from_service_account_info(
              creds_json, 
              scopes=['https://www.googleapis.com/auth/spreadsheets']
          )
          service = build('sheets', 'v4', credentials=creds)
          
          try:
              with open('final_data.json', 'r', encoding='utf-8') as f:
                  raw_content = f.read()
                  data = json.loads(raw_content)
          except json.JSONDecodeError:
              print('ОШИБКА: Неправильный формат данных (возможно, мешают кавычки в названиях тикетов).')
              print('Собранный текст:', raw_content)
              raise
          
          if not data:
              print('Нет данных для отправки.')
          else:
              service.spreadsheets().values().append(
                  spreadsheetId=os.environ['DOCUMENT_ID'],
                  range='A1', 
                  valueInputOption='USER_ENTERED',
                  body={'values': data}
              ).execute()
              print('Данные успешно отправлены в таблицу!')
          "
