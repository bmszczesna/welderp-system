<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Archiwum - WeldERP</title>

    <link rel="stylesheet" href="/frontend/css/kanban.css">
</head>

<body>

<div class="page">

    <div class="topbar">

        <h1>Archiwum Zleceń</h1>

        <button class="btn"
            onclick="window.location.href='/kanban.html'">

            Powrót
        </button>

    </div>

    <div id="archiveContainer" class="cards"></div>

</div>

<!-- MODAL -->

<div id="archiveModal" class="modal-overlay">

    <div class="modal-box">

        <span class="modal-close"
            onclick="closeArchiveModal()">

            &times;
        </span>

        <div id="archiveModalContent"></div>

    </div>

</div>

<script>

async function loadArchive() {

    const res = await fetch("/orders/");

    const orders = await res.json();

    const archived = orders.filter(
        o => o.status === "ARCHIVED"
    );

    const container =
        document.getElementById("archiveContainer");

    container.innerHTML = "";

    archived.forEach(order => {

        const div = document.createElement("div");

        div.className = "order-card";

        div.innerHTML = `

            <div class="card-header">

                <div>

                    <p class="order-number">
                        <strong>${order.order_number}</strong>
                    </p>

                    <p class="client">
                        ${order.client_name}
                    </p>

                </div>

                <button class="btn"
                    onclick="openArchiveModal(${order.id})">

                    Szczegóły
                </button>

            </div>

            <div style="
                margin-top: 12px;
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                font-size: 13px;
                color: #6b7280;
            ">

                <span>
                    📥 Data złożenia:
                    ${
                        order.date_received
                        ? order.date_received.slice(0,10)
                        : "Brak"
                    }
                </span>

                <span>
                    📅 Termin:
                    ${
                        order.date_deadline
                        ? order.date_deadline.slice(0,10)
                        : "Brak"
                    }
                </span>

                <span>
                    👤 Operator:
                    ${order.operator || "Brak"}
                </span>

            </div>
        `;

        container.appendChild(div);
    });
}

loadArchive();


// MODAL SZCZEGÓŁÓW

function openArchiveModal(orderId) {

    fetch(`/orders/${orderId}`)
        .then(res => res.json())
        .then(order => {

            let html = `

                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: start;
                    gap: 20px;
                    margin-bottom: 20px;
                ">

                    <div>

                        <h2 style="
                            margin-bottom: 10px;
                        ">
                            ${order.order_number}
                        </h2>

                        <p>
                            <strong>Klient:</strong>
                            ${order.client_name}
                        </p>

                        <p>
                            <strong>Operator:</strong>
                            ${order.operator || "Brak"}
                        </p>

                        <p>
                            <strong>Data złożenia:</strong>

                            ${
                                order.date_received
                                ? order.date_received.slice(0,10)
                                : "Brak"
                            }
                        </p>

                        <p>
                            <strong>Termin realizacji:</strong>

                            ${
                                order.date_deadline
                                ? order.date_deadline.slice(0,10)
                                : "Brak"
                            }
                        </p>

                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    ">

                        <a href="/orders/${order.id}/pdf"
                            target="_blank"
                            class="btn">

                            Karta PDF
                        </a>

                        <button
                            class="btn"
                            style="
                                border-color: #8b5cf6;
                                color: #8b5cf6;
                            "
                            onclick="downloadAIReport()">

                            Raport AI
                        </button>

                    </div>

                </div>

                <hr>

                <h3 style="
                    margin-top: 20px;
                    margin-bottom: 20px;
                ">
                    Części i proces produkcji
                </h3>
            `;

            order.parts.forEach(part => {

                html += `

                    <div style="
                        margin-bottom: 20px;
                        padding: 15px;
                        border: 1px solid #e5e7eb;
                        border-radius: 10px;
                        background: #f9fafb;
                    ">

                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 10px;
                        ">

                            <strong style="
                                font-size: 16px;
                            ">
                                ${part.part_name}
                            </strong>

                            <span style="
                                font-size: 13px;
                                color: #6b7280;
                            ">
                                👤 ${part.operator || "Brak operatora"}
                            </span>

                        </div>
                `;

                if (part.steps.length > 0) {

                    html += `
                        <ul style="
                            margin-top: 10px;
                            padding-left: 20px;
                        ">
                    `;

                    part.steps.forEach(step => {

                        html += `

                            <li style="
                                margin-bottom: 10px;
                            ">

                                <div style="
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                    gap: 15px;
                                ">

                                    <span>
                                        ${step.step_name}
                                    </span>

                                    ${
                                        step.pdf_path
                                        ? `
                                        <a href="/${step.pdf_path}"
                                            target="_blank"
                                            class="pdf-badge">

                                            PDF
                                        </a>
                                        `
                                        : `
                                        <span style="
                                            font-size: 12px;
                                            color: #9ca3af;
                                        ">
                                            Brak PDF
                                        </span>
                                        `
                                    }

                                </div>

                            </li>
                        `;
                    });

                    html += `</ul>`;
                }

                html += `</div>`;
            });

            document.getElementById(
                "archiveModalContent"
            ).innerHTML = html;

            document.getElementById(
                "archiveModal"
            ).style.display = "block";
        });
}

function closeArchiveModal() {

    document.getElementById(
        "archiveModal"
    ).style.display = "none";
}


// zamykanie modala po kliknięciu tła

window.onclick = function(event) {

    const modal =
        document.getElementById("archiveModal");

    if (event.target === modal) {

        modal.style.display = "none";
    }
}

  async function downloadAIReport() {

    const loadingBtn = document.querySelector(
        '[onclick="downloadAIReport()"]'
    );

    const originalText =
        loadingBtn.innerHTML;

    try {

        loadingBtn.innerHTML =
            "Generowanie raportu...";

        loadingBtn.disabled = true;

        const response =
            await fetch("/reports/ai-pdf");

        if (!response.ok) {

            throw new Error();
        }

        const blob =
            await response.blob();

        const url =
            window.URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            `Raport_AI_${new Date()
                .toISOString()
                .slice(0,10)}.pdf`;

        document.body.appendChild(a);

        a.click();

        window.URL.revokeObjectURL(url);

        loadingBtn.innerHTML =
            "Pobrano raport";

        setTimeout(() => {

            loadingBtn.innerHTML =
                originalText;

            loadingBtn.disabled = false;

        }, 2000);

    } catch (error) {

        console.error(error);

        loadingBtn.innerHTML =
            "Błąd raportu";

        setTimeout(() => {

            loadingBtn.innerHTML =
                originalText;

            loadingBtn.disabled = false;

        }, 2000);

        alert(
            "Nie udało się wygenerować raportu AI"
        );
    }
}
</script>

</body>
</html>
