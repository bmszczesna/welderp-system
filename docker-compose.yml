version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: welderp_db
    environment:
      POSTGRES_USER: welderp_user
      POSTGRES_PASSWORD: welderp_password
      POSTGRES_DB: welderp_db
    ports:
      - "5432:5431"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: welderp_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://welderp_user:welderp_password@db:5432/welderp_db

volumes:
  postgres_data: