name: Testy WeldERP
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zależności generatora PDF
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - name: Zależności aplikacji i testów
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Testy
        run: python -m pytest
