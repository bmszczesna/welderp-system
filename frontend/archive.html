<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <title>
        Archiwum - WeldERP
    </title>

    <link rel="stylesheet"
          href="/frontend/css/kanban.css">

</head>

<body>

<div class="page">

    <div class="topbar">

        <h1>
            Archiwum Zleceń
        </h1>


        <button class="btn"
                onclick="window.location.href='/kanban.html'">

            Powrót
        </button>

    </div>

    <!-- FILTRY AI -->

    <div style="
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    margin-bottom: 25px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    display: flex;
    gap: 20px;
    align-items: flex-end;
    flex-wrap: wrap;
">

    <div style="flex: 1; min-width: 150px;">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #4b5563; text-transform: uppercase;">
            Data od
        </label>
        <input type="date" id="dateFrom" class="search" style="width: 100%; box-sizing: border-box; background-color: #f9fafb;">
    </div>

    <div style="flex: 1; min-width: 150px;">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #4b5563; text-transform: uppercase;">
            Data do
        </label>
        <input type="date" id="dateTo" class="search" style="width: 100%; box-sizing: border-box; background-color: #f9fafb;">
    </div>

    <button
        class="btn"
        onclick="generateArchiveAIReport(event)"
        style="
            border: 2px solid #8b5cf6;
            color: white;
            background: #8b5cf6;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.2s ease;
        "
        onmouseover="this.style.background='#7c3aed'; this.style.borderColor='#7c3aed';"
        onmouseout="this.style.background='#8b5cf6'; this.style.borderColor='#8b5cf6';"
    >
        ✨ Generuj raport AI
    </button>
    </div>

    <div id="archiveContainer"
         class="cards">

    </div>

</div>

<!-- MODAL -->

<div id="archiveModal"
     class="modal-overlay">

    <div class="modal-box">

        <span class="modal-close"
              onclick="closeArchiveModal()">

            &times;
        </span>

        <div id="archiveModalContent"></div>

    </div>

</div>

<script>

async function loadArchive() {

    const res = await fetch("/orders/");

    const orders = await res.json();

    const archived = orders.filter(
        o => o.status === "ARCHIVED"
    );

    const container =
        document.getElementById(
            "archiveContainer"
        );

    container.innerHTML = "";

    archived.forEach(order => {

        const div =
            document.createElement("div");

        div.className = "order-card";

        div.innerHTML = `

            <div class="card-header">

                <div>

                    <p class="order-number">

                        <strong>
                            ${order.order_number}
                        </strong>

                    </p>

                    <p class="client">
                        ${order.client_name}
                    </p>

                </div>

                <button class="btn"
                        onclick="openArchiveModal(${order.id})">

                    Szczegóły
                </button>

            </div>

            <div style="
                margin-top: 12px;
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                font-size: 13px;
                color: #6b7280;
            ">

                <span>

                    📥 Data złożenia:

                    ${
                        order.date_received
                        ? order.date_received.slice(0,10)
                        : "Brak"
                    }

                </span>

                <span>

                    📅 Termin:

                    ${
                        order.date_deadline
                        ? order.date_deadline.slice(0,10)
                        : "Brak"
                    }

                </span>

                <span>

                    👤 Operator:

                    ${order.operator || "Brak"}

                </span>

            </div>
        `;

        container.appendChild(div);
    });
}

loadArchive();


// MODAL

function openArchiveModal(orderId) {

    fetch(`/orders/${orderId}`)

        .then(res => res.json())

        .then(order => {

            let html = `

                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: start;
                    gap: 20px;
                    margin-bottom: 20px;
                    flex-wrap: wrap;
                ">

                    <div>

                        <h2 style="
                            margin-bottom: 10px;
                        ">

                            ${order.order_number}

                        </h2>

                        <p>

                            <strong>
                                Klient:
                            </strong>

                            ${order.client_name}

                        </p>

                        <p>

                            <strong>
                                Operator:
                            </strong>

                            ${order.operator || "Brak"}

                        </p>

                        <p>

                            <strong>
                                Data złożenia:
                            </strong>

                            ${
                                order.date_received
                                ? order.date_received.slice(0,10)
                                : "Brak"
                            }

                        </p>

                        <p>

                            <strong>
                                Termin realizacji:
                            </strong>

                            ${
                                order.date_deadline
                                ? order.date_deadline.slice(0,10)
                                : "Brak"
                            }

                        </p>

                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    ">

                        <a href="/orders/${order.id}/pdf"
                           target="_blank"
                           class="btn">

                            Karta PDF
                        </a>

                        <button
                            class="btn ai-report-btn"
                            data-order-id="${order.id}"
                            style="
                                border-color: #8b5cf6;
                                color: #8b5cf6;
                            "
                            onclick="downloadAIReport(${order.id})"
                        >

                            Raport AI

                        </button>

                    </div>

                </div>

                <hr>

                <h3 style="
                    margin-top: 20px;
                    margin-bottom: 20px;
                ">

                    Części i proces produkcji

                </h3>
            `;

            order.parts.forEach(part => {

                html += `

                    <div style="
                        margin-bottom: 20px;
                        padding: 15px;
                        border: 1px solid #e5e7eb;
                        border-radius: 10px;
                        background: #f9fafb;
                    ">

                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 10px;
                            flex-wrap: wrap;
                            gap: 10px;
                        ">

                            <strong style="
                                font-size: 16px;
                            ">

                                ${part.part_name}

                            </strong>

                            <span style="
                                font-size: 13px;
                                color: #6b7280;
                            ">

                                👤 ${part.operator || "Brak operatora"}

                            </span>

                        </div>
                `;

                if (part.steps.length > 0) {

                    html += `

                        <ul style="
                            margin-top: 10px;
                            padding-left: 20px;
                        ">
                    `;

                    part.steps.forEach(step => {

                        html += `

                            <li style="
                                margin-bottom: 10px;
                            ">

                                <div style="
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                    gap: 15px;
                                    flex-wrap: wrap;
                                ">

                                    <span>
                                        ${step.step_name}
                                    </span>

                                    ${
                                        step.pdf_path
                                        ? `
                                        <a href="/${step.pdf_path}"
                                           target="_blank"
                                           class="pdf-badge">

                                            PDF

                                        </a>
                                        `
                                        : `
                                        <span style="
                                            font-size: 12px;
                                            color: #9ca3af;
                                        ">

                                            Brak PDF

                                        </span>
                                        `
                                    }

                                </div>

                            </li>
                        `;
                    });

                    html += `</ul>`;
                }

                html += `</div>`;
            });

            document.getElementById(
                "archiveModalContent"
            ).innerHTML = html;

            document.getElementById(
                "archiveModal"
            ).style.display = "block";
        });
}

function closeArchiveModal() {

    document.getElementById(
        "archiveModal"
    ).style.display = "none";
}


// ZAMYKANIE MODALA

window.onclick = function(event) {

    const modal =
        document.getElementById(
            "archiveModal"
        );

    if (event.target === modal) {

        modal.style.display = "none";
    }
}


// RAPORT AI DLA JEDNEGO ZLECENIA

async function downloadAIReport(orderId) {

    const loadingBtn = document.querySelector(
        `[data-order-id="${orderId}"]`
    );

    const originalText =
        loadingBtn.innerHTML;

    try {

        loadingBtn.innerHTML =
            "Generowanie raportu...";

        loadingBtn.disabled = true;

        const response =
            await fetch(
                `/orders/${orderId}/ai-summary`
            );

        if (!response.ok) {

            throw new Error();
        }

        const blob =
            await response.blob();

        const url =
            window.URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            `Raport_AI_${orderId}.pdf`;

        document.body.appendChild(a);

        a.click();

        window.URL.revokeObjectURL(url);

        loadingBtn.innerHTML =
            "Pobrano raport";

        setTimeout(() => {

            loadingBtn.innerHTML =
                originalText;

            loadingBtn.disabled = false;

        }, 2000);

    } catch (error) {

        console.error(error);

        loadingBtn.innerHTML =
            "Błąd raportu";

        setTimeout(() => {

            loadingBtn.innerHTML =
                originalText;

            loadingBtn.disabled = false;

        }, 2000);

        alert(
            "Nie udało się wygenerować raportu AI"
        );
    }
}


// RAPORT AI DLA ARCHIWUM

async function generateArchiveAIReport(event) {

    const button = event.target;

    const originalText =
        button.innerHTML;

    button.innerHTML =
        "Generowanie raportu...";

    button.disabled = true;

    const dateFrom =
        document.getElementById(
            "dateFrom"
        ).value;

    const dateTo =
        document.getElementById(
            "dateTo"
        ).value;

    if (!dateFrom || !dateTo) {

        alert(
            "Wybierz zakres dat"
        );

        button.innerHTML =
            originalText;

        button.disabled = false;

        return;
    }

    try {

        const response = await fetch(

            `/reports/archive-ai-pdf?date_from=${dateFrom}&date_to=${dateTo}`
        );

        if (!response.ok) {

            throw new Error();
        }

        const blob =
            await response.blob();

        const url =
            window.URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "Raport_Archiwum_AI.pdf";

        document.body.appendChild(a);

        a.click();

        window.URL.revokeObjectURL(url);

        button.innerHTML =
            "Pobrano raport";

        setTimeout(() => {

            button.innerHTML =
                originalText;

            button.disabled = false;

        }, 2000);

    } catch (error) {

        console.error(error);

        button.innerHTML =
            "Błąd raportu";

        setTimeout(() => {

            button.innerHTML =
                originalText;

            button.disabled = false;

        }, 2000);

        alert(
            "Nie udało się wygenerować raportu AI"
        );
    }
}

</script>

</body>

</html>
