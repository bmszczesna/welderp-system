<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>WeldERP - Zarządzanie Zleceniami</title>
    <style>
        :root {
            --bg: #f3f5f9; --card: #ffffff; --text: #1f2937;
            --border: #e5e7eb; --primary: #111827; --success: #22c55e; --danger: #ef4444;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 40px; }
        
        .navbar { background: var(--card); padding: 15px 30px; margin-bottom: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .btn-nav { background: var(--primary); color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: background 0.2s; }
        .btn-nav:hover { background: #374151; }

        .dashboard-container { display: grid; grid-template-columns: 350px 1fr; gap: 30px; align-items: start; }
        .panel { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .panel h2 { margin-top: 0; font-size: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
        .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; box-sizing: border-box; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--success); color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #16a34a; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-size: 13px; color: #6b7280; font-weight: 600; text-transform: uppercase; }
        td { font-size: 14px; }
        
        .part-badge { background: #e5e7eb; color: #374151; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-right: 4px; display: inline-block; margin-bottom: 2px;}
        
        .status-select { padding: 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; font-weight: bold; cursor: pointer; outline: none;}
        .status-IN_QUEUE { background: #e5e7eb; color: #374151; }
        .status-IN_PROGRESS { background: #fef3c7; color: #d97706; }
        .status-QUALITY_CHECK { background: #dbeafe; color: #1d4ed8; }
        .status-COMPLETED { background: #dcfce3; color: #16a34a; }

        .btn-danger { background: var(--danger); color: white; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>🛠️ WeldERP</h1>
        <a href="/kanban.html" class="btn-nav">📊 Przejdź do Tablicy Kanban</a>
    </div>

    <div class="dashboard-container">
        
        <div class="panel">
            <h2>➕ Nowe Zlecenie</h2>
            <div class="form-group">
                <label>Numer Zlecenia</label>
                <input type="text" id="order_number" placeholder="np. ZL/001">
            </div>
            <div class="form-group">
                <label>Klient</label>
                <input type="text" id="client_name" placeholder="Nazwa firmy/klienta">
            </div>
            <div class="form-group">
                <label>Części (oddziel po przecinku)</label>
                <input type="text" id="parts" placeholder="Rama, Drzwi">
            </div>
            <div class="form-group">
                <label>Termin Realizacji (Deadline)</label>
                <input type="datetime-local" id="date_deadline">
            </div>
            <button class="btn-submit" onclick="addOrder()">Utwórz Zlecenie</button>
        </div>

        <div class="panel">
            <h2>📋 Rejestr Zleceń</h2>
            <table>
                <thead>
                    <tr>
                        <th>Numer</th>
                        <th>Klient</th>
                        <th>Części</th>
                        <th>Termin</th>
                        <th>Status</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Funkcja POST - Dodawanie zlecenia
        async function addOrder() {
            const num = document.getElementById("order_number").value;
            const client = document.getElementById("client_name").value;
            const partsStr = document.getElementById("parts").value;
            let deadline = document.getElementById("date_deadline").value;

            if (!num || !client) {
                alert("Wypełnij numer i klienta!");
                return;
            }

            if (deadline) {
                deadline = new Date(deadline).toISOString();
            } else {
                deadline = null;
            }

            const partsList = partsStr.split(",").map(p => p.trim()).filter(p => p.length > 0);
            const payloadParts = partsList.map(p => ({ part_name: p }));

            const payload = {
                order_number: num,
                client_name: client,
                date_deadline: deadline,
                parts: payloadParts
            };

            const res = await fetch("/orders/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("✅ Pomyślnie dodano zlecenie!");
                document.getElementById("order_number").value = "";
                document.getElementById("client_name").value = "";
                document.getElementById("parts").value = "";
                document.getElementById("date_deadline").value = "";
                loadOrders();
            } else {
                const data = await res.json();
                alert("❌ Błąd: " + (data.detail || "Nieznany błąd"));
            }
        }

        // PRZYWRÓCONA FUNKCJA: Szybka zmiana statusu
        async function updateStatus(id, newStatus) {
            const res = await fetch(`/orders/${id}/status?status=${newStatus}`, { method: "PUT" });
            if (res.ok) {
                loadOrders(); // Odśwież tabelę, żeby zaktualizować kolory
            } else {
                alert("❌ Błąd podczas zmiany statusu");
            }
        }

        // Funkcja GET - Pobieranie zleceń
        async function loadOrders() {
            const res = await fetch("/orders/");
            const data = await res.json();
            const tbody = document.getElementById("ordersTableBody");
            tbody.innerHTML = ""; 

            data.forEach(o => {
                const tr = document.createElement("tr");
                
                const deadlineStr = o.date_deadline ? o.date_deadline.slice(0, 10) : "Brak";
                
                // PRZYWRÓCONE: Wyświetlanie części (jako ładne plakietki)
                const partsHtml = o.parts && o.parts.length > 0 
                    ? o.parts.map(p => `<span class="part-badge">${p.part_name}</span>`).join('') 
                    : "-";
                
                tr.innerHTML = `
                    <td><strong>${o.order_number}</strong></td>
                    <td>${o.client_name}</td>
                    <td>${partsHtml}</td>
                    <td>${deadlineStr}</td>
                    <td>
                        <select class="status-select status-${o.status}" onchange="updateStatus(${o.id}, this.value)">
                            <option value="IN_QUEUE" ${o.status === 'IN_QUEUE' ? 'selected' : ''}>Oczekujące</option>
                            <option value="IN_PROGRESS" ${o.status === 'IN_PROGRESS' ? 'selected' : ''}>W toku</option>
                            <option value="QUALITY_CHECK" ${o.status === 'QUALITY_CHECK' ? 'selected' : ''}>Kontrola</option>
                            <option value="COMPLETED" ${o.status === 'COMPLETED' ? 'selected' : ''}>Gotowe</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-danger" onclick="deleteOrder(${o.id})">🗑️ Usuń</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Funkcja DELETE - Usuwanie zlecenia
        async function deleteOrder(id) {
            if (!confirm("Czy na pewno chcesz usunąć to zlecenie?")) return;
            const res = await fetch("/orders/" + id, { method: "DELETE" });
            if (res.ok) loadOrders();
        }

        window.onload = loadOrders;
    </script>
</body>
</html>
