    <!-- FILTRY LISTY ARCHIWUM -->

    <div style="

<!-- MODAL -->

<div id="archiveModal"
     class="modal-overlay">

    <div class="modal-box archive-modal-box">

              onclick="closeArchiveModal()">

            &times;
        </span>

        <div id="archiveModalContent" class="archive-modal-content"></div>

    </div>

<script src="/frontend/js/api.js?v=manager-planning-1"></script>
<script>

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDateTime(value) {
        if (!value) return "Nie wykonano";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Nie wykonano";
        return date.toLocaleString("pl-PL", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function statusLabel(status) {
        const labels = {
            IN_QUEUE: "Oczekujące",
            IN_PROGRESS: "W realizacji",
            QUALITY_CHECK: "Kontrola jakości",
            COMPLETED: "Zakończone",
            ARCHIVED: "Archiwum"
        };

        return labels[status] || status || "Utworzenie";
    }

    let archiveOrders = [];

    document.getElementById("archiveClient")
        .addEventListener("input", renderArchive);

    document.getElementById("archiveDateFrom")
        .addEventListener("change", renderArchive);

    document.getElementById("archiveDateTo")
        .addEventListener("change", renderArchive);

    async function loadArchive() {

        const container = document.getElementById("archiveContainer");

        try {
            const res = await fetch("/orders/");

            if (!res.ok) {
                throw new Error("Nie udało się pobrać archiwum");
            }

            const orders = await res.json();

            archiveOrders = orders.filter(
                order => order.status === "ARCHIVED"
            );

            renderArchive();

        } catch (error) {
            console.error(error);

            container.textContent =
                "Nie udało się pobrać zleceń z archiwum.";
        }
    }


    // WYŚWIETLANIE I FILTROWANIE ARCHIWUM

    function renderArchive() {

        const query = document
            .getElementById("archiveClient")
            .value
            .trim()
            .toLocaleLowerCase("pl");

        const dateFrom = document
            .getElementById("archiveDateFrom")
            .value;

        const dateTo = document
            .getElementById("archiveDateTo")
            .value;

        const filteredOrders = archiveOrders.filter(order => {

            const clientName = (order.client_name || "")
                .toLocaleLowerCase("pl");

            const receivedDate = order.date_received
                ? order.date_received.slice(0, 10)
                : "";

            const matchesClient =
                !query || clientName.includes(query);

            const matchesFrom =
                !dateFrom || (receivedDate && receivedDate >= dateFrom);

            const matchesTo =
                !dateTo || (receivedDate && receivedDate <= dateTo);

            return matchesClient && matchesFrom && matchesTo;
        });

        const container = document.getElementById("archiveContainer");

        const counter = document.getElementById("archiveCounter");

        container.innerHTML = "";

        counter.textContent =
            `Wyświetlono ${filteredOrders.length} z ${archiveOrders.length} zleceń`;

        if (filteredOrders.length === 0) {

            const message = document.createElement("p");

            message.textContent =
                "Brak zleceń spełniających wybrane kryteria.";

            container.appendChild(message);

            return;
        }

        filteredOrders.forEach(order => {

            const div = document.createElement("div");

            div.className = "order-card";

            div.innerHTML = `

            <div class="card-header">

                <div>

                    <p class="order-number">
                        <strong>
                            ${escapeHtml(order.order_number)}
                        </strong>
                    </p>

                    <p class="client">
                        ${escapeHtml(order.client_name)}
                    </p>

                </div>

                <button class="btn"
                        onclick="openArchiveModal(${Number(order.id)})">
                    Szczegóły
                </button>

            </div>

            <div style="
                margin-top: 12px;
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                font-size: 13px;
                color: #6b7280;
            ">

                <span>
                    📥 Data złożenia:
                    ${
                order.date_received
                    ? escapeHtml(order.date_received.slice(0, 10))
                    : "Brak"
            }
                </span>

                <span>
                    📅 Termin:
                    ${
                order.date_deadline
                    ? escapeHtml(order.date_deadline.slice(0, 10))
                    : "Brak"
            }
                </span>

                <span>
                    👤 Operator:
                    ${escapeHtml(order.operator || "Brak")}
                </span>

            </div>
        `;

            container.appendChild(div);
        });
    }


    // CZYSZCZENIE FILTRÓW

    function clearArchiveFilters() {

        document.getElementById("archiveClient").value = "";

        document.getElementById("archiveDateFrom").value = "";

        document.getElementById("archiveDateTo").value = "";

        renderArchive();
    }

    loadArchive();


    // MODAL

    function openArchiveModal(orderId) {

        fetch(`/orders/${orderId}`)

            .then(res => res.json())

            .then(order => {

                let html = `

                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: start;
                    gap: 20px;
                    margin-bottom: 20px;
                    flex-wrap: wrap;
                ">

                    <div>

                        <h2 style="
                            margin-bottom: 10px;
                        ">

                            ${escapeHtml(order.order_number)}

                        </h2>

                        <p>

                            <strong>
                                Klient:
                            </strong>

                            ${escapeHtml(order.client_name)}

                        </p>

                        <p>

                            <strong>
                                Operator:
                            </strong>

                            ${escapeHtml(order.operator || "Brak")}

                        </p>

                        <p>

                            <strong>
                                Data złożenia:
                            </strong>

                            ${
                    order.date_received
                        ? order.date_received.slice(0, 10)
                        : "Brak"
                }

                        </p>

                        <p>

                            <strong>
                                Termin realizacji:
                            </strong>

                            ${
                    order.date_deadline
                        ? order.date_deadline.slice(0, 10)
                        : "Brak"
                }

                        </p>

                    </div>

                    <div style="
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    ">

                        <a href="/orders/${order.id}/pdf"
                           target="_blank"
                           class="btn">

                            Karta PDF
                        </a>

                        <button
                            class="btn ai-report-btn"
                            data-order-id="${order.id}"
                            style="
                                border-color: #8b5cf6;
                                color: #8b5cf6;
                            "
                            onclick="downloadAIReport(${order.id})"
                        >

                            Raport AI

                        </button>

                    </div>

                </div>

                <hr>

                <h3 style="
                    margin-top: 20px;
                    margin-bottom: 20px;
                ">

                    Części i proces produkcji

                </h3>
            `;

                order.parts.forEach(part => {
                    const partMaterialUsage =
                        part.material_quantity !== null && part.material_quantity !== undefined
                            ? `${escapeHtml(part.material_quantity)} ${escapeHtml(part.material_unit || "")}`
                            : "Brak";

                    html += `

                    <div style="
                        margin-bottom: 20px;
                        padding: 15px;
                        border: 1px solid #e5e7eb;
                        border-radius: 10px;
                        background: #f9fafb;
                    ">

                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 10px;
                            flex-wrap: wrap;
                            gap: 10px;
                        ">

                            <strong style="
                                font-size: 16px;
                            ">

                                ${escapeHtml(part.part_name)}

                            </strong>

                            <span style="
                                font-size: 13px;
                                color: #6b7280;
                            ">

                                👤 ${escapeHtml(part.operator || "Brak operatora")}

                            </span>

                        </div>

                        <div style="
                            display: grid;
                            grid-template-columns: repeat(2, minmax(140px, 1fr));
                            gap: 8px 12px;
                            margin-bottom: 12px;
                            padding: 10px;
                            border: 1px solid #e5e7eb;
                            border-radius: 8px;
                            background: #ffffff;
                            font-size: 12px;
                            color: #4b5563;
                        ">
                            <span><strong>Materiał:</strong> ${escapeHtml(part.material || "Brak")}</span>
                            <span><strong>Zużyta ilość:</strong> ${partMaterialUsage}</span>
                        </div>
                `;

                    html += (part.pdfs || []).map(pdf => `<a target="_blank" class="pdf-badge" href="${escapeHtml(pdf.url)}">${escapeHtml(pdf.file_name)}</a>`).join(' ');
                    if (part.steps.length > 0) {

                        html += `

                        <ul style="
                            margin-top: 10px;
                            padding-left: 20px;
                        ">
                    `;

                        part.steps.forEach(step => {

                            html += `

                            <li style="
                                margin-bottom: 10px;
                            ">

                                <div style="
                                    display: grid;
                                    gap: 8px;
                                    padding: 10px;
                                    border: 1px solid #e5e7eb;
                                    border-radius: 8px;
                                    background: #ffffff;
                                ">

                                    <div style="
                                        display: flex;
                                        justify-content: space-between;
                                        align-items: center;
                                        gap: 15px;
                                        flex-wrap: wrap;
                                    ">

                                        <span>
                                            ${escapeHtml(step.step_name)}
                                        </span>

                                        <span style="
                                            font-size: 12px;
                                            color: ${step.is_completed ? "#047857" : "#6b7280"};
                                            font-weight: 700;
                                        ">
                                            ${step.is_completed ? "Wykonano" : "Nie wykonano"}
                                        </span>

                                    </div>

                                    <div style="
                                        display: grid;
                                        grid-template-columns: repeat(2, minmax(140px, 1fr));
                                        gap: 6px 12px;
                                        font-size: 12px;
                                        color: #4b5563;
                                    ">

                                        <span><strong>Operator:</strong> ${escapeHtml(step.operator || "Brak")}</span>
                                        <span><strong>Data wykonania:</strong> ${escapeHtml(formatDateTime(step.completed_at))}</span>

                                    </div>

                                    <div style="
                                        display: flex;
                                        justify-content: flex-end;
                                        align-items: center;
                                        gap: 15px;
                                        flex-wrap: wrap;
                                    ">

                                    ${
                                step.pdf_path
                                    ? `
                                        <a href="/${step.pdf_path}"
                                           target="_blank"
                                           class="pdf-badge">

                                            PDF

                                        </a>
                                        `
                                    : `
                                        <span style="
                                            font-size: 12px;
                                            color: #9ca3af;
                                        ">

                                            Brak PDF

                                        </span>
                                        `
                            }

                                    </div>

                                </div>

                            </li>
                        `;
                        });

                        html += `</ul>`;
                    }


                    html += `</div>`;
                });
                // HISTORIA ZMIAN STATUSÓW

                html += `
    <hr style="margin: 25px 0;">

    <h3>Historia zmian statusów</h3>
`;

                const events = order.status_events || [];

                if (events.length === 0) {

                    html += `
        <p style="color: #6b7280;">
            Brak zapisanej historii zmian statusów.
        </p>
    `;

                } else {

                    html += `
        <div style="display: grid; gap: 10px;">
    `;

                    events.forEach(event => {

                        html += `
            <div style="
                padding: 12px;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                background: #f9fafb;
            ">

                <strong>
                    ${
                            event.from_status
                                ? `${escapeHtml(statusLabel(event.from_status))} → ${escapeHtml(statusLabel(event.to_status))}`
                                : `Utworzenie zlecenia → ${escapeHtml(statusLabel(event.to_status))}`
                        }
                </strong>

                <p style="margin: 6px 0; font-size: 13px;">
                    ${escapeHtml(formatDateTime(event.occurred_at))}
                </p>

                <p style="margin: 0; color: #6b7280;">
                    ${escapeHtml(event.reason)}
                </p>

            </div>
        `;
                    });

                    html += `</div>`;
                }

                document.getElementById(
                    "archiveModalContent"
                ).innerHTML = html;

                document.getElementById(
                    "archiveModal"
                ).style.display = "flex";
            });
    }

    function closeArchiveModal() {

        document.getElementById(
            "archiveModal"
        ).style.display = "none";
    }


    // ZAMYKANIE MODALA

    window.onclick = function (event) {

        const modal =
            document.getElementById(
                "archiveModal"
            );

        if (event.target === modal) {

            modal.style.display = "none";
        }
    }


    // RAPORT AI DLA JEDNEGO ZLECENIA

    async function downloadAIReport(orderId) {

        const loadingBtn = document.querySelector(
            `[data-order-id="${orderId}"]`
        );

        const originalText =
            loadingBtn.innerHTML;

        try {

            loadingBtn.innerHTML =
                "Generowanie raportu...";

            loadingBtn.disabled = true;

            const response =
                await fetch(
                    `/orders/${orderId}/ai-summary`
                );

            if (!response.ok) {

                throw new Error();
            }

            const blob =
                await response.blob();

            const url =
                window.URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                `Raport_AI_${orderId}.pdf`;

            document.body.appendChild(a);

            a.click();

            window.URL.revokeObjectURL(url);

            loadingBtn.innerHTML =
                "Pobrano raport";

            setTimeout(() => {

                loadingBtn.innerHTML =
                    originalText;

                loadingBtn.disabled = false;

            }, 2000);

        } catch (error) {

            console.error(error);

            loadingBtn.innerHTML =
                "Błąd raportu";

            setTimeout(() => {

                loadingBtn.innerHTML =
                    originalText;

                loadingBtn.disabled = false;

            }, 2000);

            alert(
                "Nie udało się wygenerować raportu AI"
            );
        }
    }


    // RAPORT AI DLA ARCHIWUM

    let archiveReportUrl = null;

    async function generateArchiveAIReport(event) {
        const button = event.currentTarget;
        const originalText = button.innerHTML;

        const client = document.getElementById("archiveClient").value.trim();
        const dateFrom = document.getElementById("archiveDateFrom").value;
        const dateTo = document.getElementById("archiveDateTo").value;

        if (dateFrom && dateTo && dateFrom > dateTo) {
            alert("Data od nie może być późniejsza niż data do.");
            return;
        }

        const params = new URLSearchParams();

        if (client) params.set("client", client);
        if (dateFrom) params.set("date_from", dateFrom);
        if (dateTo) params.set("date_to", dateTo);

        const preview = document.getElementById("archiveReportPreview");
        const frame = document.getElementById("archiveReportFrame");
        const download = document.getElementById("archiveReportDownload");

        button.disabled = true;
        button.textContent = "Generowanie raportu...";

        try {
            const response = await fetch(
                `/reports/archive-ai-pdf?${params.toString()}`
            );

            if (!response.ok) {
                throw new Error(`Błąd HTTP: ${response.status}`);
            }

            const blob = await response.blob();

            if (!blob.type.includes("pdf")) {
                throw new Error("Serwer nie zwrócił pliku PDF.");
            }

            const newUrl = URL.createObjectURL(blob);

            frame.src = newUrl;
            download.href = newUrl;
            preview.style.display = "block";

            if (archiveReportUrl) {
                URL.revokeObjectURL(archiveReportUrl);
            }

            archiveReportUrl = newUrl;

            preview.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        } catch (error) {
            console.error(error);
            alert("Nie udało się wygenerować raportu AI.");
        } finally {
            button.innerHTML = originalText;
            button.disabled = false;
        }
    }

    window.addEventListener("beforeunload", () => {
        if (archiveReportUrl) {
            URL.revokeObjectURL(archiveReportUrl);
        }
    });

</script>
