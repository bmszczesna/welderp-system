<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeldERP - Tablica Kanban</title>
    <link rel="stylesheet" href="/frontend/css/kanban.css">
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div>
                <h1 class="title">🛠️ WeldERP - Produkcja</h1>
            </div>
            <div class="actions">
                <button class="btn" style="background: white; border: 1px solid var(--border); color: black;" onclick="loadOrders()">🔄 Odśwież</button>
                <a href="/index.html" class="btn btn-primary" style="text-decoration: none; display: inline-block;">➕ Zarządzaj Zleceniami</a>
            </div>
        </header>

        <section class="board" aria-label="Kanban board">
            <article class="column">
                <div class="column-head">
                    <h2 class="column-title"><span class="dot" style="background: var(--queue); width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px;"></span>Oczekujące</h2>
                    <span class="count" id="count-IN_QUEUE" style="font-size: 12px; color: var(--muted); background: #fff; border-radius: 999px; padding: 4px 10px; font-weight: bold; border: 1px solid var(--border);">0</span>
                </div>
                <div class="cards" data-status="IN_QUEUE"></div>
            </article>

            <article class="column">
                <div class="column-head">
                    <h2 class="column-title"><span class="dot" style="background: var(--progress); width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px;"></span>W toku</h2>
                    <span class="count" id="count-IN_PROGRESS" style="font-size: 12px; color: var(--muted); background: #fff; border-radius: 999px; padding: 4px 10px; font-weight: bold; border: 1px solid var(--border);">0</span>
                </div>
                <div class="cards" data-status="IN_PROGRESS"></div>
            </article>

            <article class="column">
                <div class="column-head">
                    <h2 class="column-title"><span class="dot" style="background: var(--quality); width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px;"></span>Kontrola jakości</h2>
                    <span class="count" id="count-QUALITY_CHECK" style="font-size: 12px; color: var(--muted); background: #fff; border-radius: 999px; padding: 4px 10px; font-weight: bold; border: 1px solid var(--border);">0</span>
                </div>
                <div class="cards" data-status="QUALITY_CHECK"></div>
            </article>

            <article class="column">
                <div class="column-head">
                    <h2 class="column-title"><span class="dot" style="background: var(--done); width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px;"></span>Zakończone</h2>
                    <span class="count" id="count-COMPLETED" style="font-size: 12px; color: var(--muted); background: #fff; border-radius: 999px; padding: 4px 10px; font-weight: bold; border: 1px solid var(--border);">0</span>
                </div>
                <div class="cards" data-status="COMPLETED"></div>
            </article>
        </section>
    </main>

    <script>
        const STATUSES = ["IN_QUEUE", "IN_PROGRESS", "QUALITY_CHECK", "COMPLETED"];
        let orders = [];

        async function loadOrders() {
            try {
                const res = await fetch("/orders/");
                if (res.ok) {
                    orders = await res.json();
                    renderBoard();
                }
            } catch (err) {
                console.error("Błąd pobierania danych:", err);
            }
        }

        function renderBoard() {
            STATUSES.forEach(status => {
                document.querySelector(`.cards[data-status="${status}"]`).innerHTML = "";
                document.getElementById(`count-${status}`).textContent = "0";
            });

            const counts = { IN_QUEUE: 0, IN_PROGRESS: 0, QUALITY_CHECK: 0, COMPLETED: 0 };

            orders.forEach(order => {
                if (!order.parts || order.parts.length === 0) return;

                order.parts.forEach(part => {
                    const status = part.status || order.status; 
                    
                    if (counts[status] !== undefined) {
                        counts[status]++;
                        const card = createPartCard(order, part, status);
                        document.querySelector(`.cards[data-status="${status}"]`).appendChild(card);
                    }
                });
            });

            STATUSES.forEach(status => {
                document.getElementById(`count-${status}`).textContent = counts[status];
                const column = document.querySelector(`.cards[data-status="${status}"]`);
                if (counts[status] === 0) {
                    column.innerHTML = `<p class="empty-state" style="text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; font-style: italic;">Brak części</p>`;
                }
            });
        }

        function createPartCard(order, part, status) {
            const card = document.createElement("div");
            card.className = "order-card";
            card.draggable = true;
            
            card.dataset.partId = part.id;

            if(status === 'IN_PROGRESS') card.style.borderLeftColor = 'var(--progress)';
            if(status === 'QUALITY_CHECK') card.style.borderLeftColor = 'var(--quality)';
            if(status === 'COMPLETED') card.style.borderLeftColor = 'var(--done)';

            const deadlineStr = order.date_deadline ? order.date_deadline.slice(0,10) : 'Brak';

			let issueHtml = "";
    		if (part.issue) {
        		issueHtml = `<div style="background: #fee2e2; color: #b91c1c; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 10px; border: 1px solid #fca5a5;">🚨 PROBLEM: ${part.issue}</div>`;
        		card.style.borderLeftColor = '#ef4444'; 
    		}

            card.innerHTML = `
                <span class="card-order-num" style="font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 6px; display: block;">ZLECENIE: ${order.order_number}</span>
                <div class="card-part-name" style="font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--primary);">⚙️ ${part.part_name}</div>
                <div class="card-client" style="font-size: 13px; color: var(--muted); margin-bottom: 12px;">👤 ${order.client_name}</div>
                ${issueHtml}
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <span style="font-size: 11px; color: #9ca3af; font-weight: bold;">📅 ${deadlineStr}</span>
                    <button class="btn-issue" style="padding: 4px 8px; font-size: 11px; background: #fee2e2; color: #b91c1c; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;" onclick="reportIssue(${part.id})">⚠ Brak mat.</button>
                </div>
            `;

            card.addEventListener("dragstart", (e) => {
                e.dataTransfer.setData("text/plain", part.id);
                card.classList.add("dragging");
            });
            
            card.addEventListener("dragend", () => {
                card.classList.remove("dragging");
            });

            return card;
        }

        async function movePart(partId, targetStatus) {
            try {
                const res = await fetch(`/parts/${partId}/status?status=${targetStatus}`, {
                    method: "PUT"
                });
                
                if (res.ok) {
                    loadOrders(); 
                } else {
                    alert("Aby to zadziałało, musisz dodać funkcję przesuwania części w backendzie!");
                    loadOrders(); 
                }
            } catch (err) {
                console.error(err);
                alert("Błąd połączenia z serwerem.");
            }
        }

		async function reportIssue(partId) {
    		const issueText = prompt("Zgłoś problem (np. Brak materiału, Awaria maszyny).\nZostaw puste okienko i kliknij OK, aby usunąć stary problem:");

    		// Jeśli użytkownik nie kliknął "Anuluj"
    		if (issueText !== null) { 
        		try {
            		const res = await fetch(`/parts/${partId}/issue?issue_text=${encodeURIComponent(issueText)}`, {
                	method: "PUT"
            });
            
            	if (res.ok) {
                	loadOrders(); 
            	} else {
                	alert("Błąd podczas zgłaszania problemu!");
            	}
        	} catch (err) {
            	console.error(err);
            	alert("Błąd połączenia z serwerem.");
        	}
    	}
	}

        function setupDropZones() {
            document.querySelectorAll(".cards").forEach(zone => {
                zone.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    zone.classList.add("drop-active");
                    zone.style.background = "#dfe2e9";
                    zone.style.outline = "2px dashed #9ca3af";
                    zone.style.outlineOffset = "-4px";
                    zone.style.borderRadius = "0 0 12px 12px";
                });

                zone.addEventListener("dragleave", () => {
                    zone.classList.remove("drop-active");
                    zone.style.background = "";
                    zone.style.outline = "";
                });

                zone.addEventListener("drop", (e) => {
                    e.preventDefault();
                    zone.classList.remove("drop-active");
                    zone.style.background = "";
                    zone.style.outline = "";

                    const partId = e.dataTransfer.getData("text/plain");
                    const targetStatus = zone.dataset.status;
                    
                    if (partId && targetStatus) {
                        movePart(partId, targetStatus);
                    }
                });
            });
        }

        setupDropZones();
        window.onload = loadOrders;
    </script>
</body>
</html>
