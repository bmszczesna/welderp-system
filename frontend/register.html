<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja WeldERP</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 380px;
        }
        h3 { margin: 0 0 24px 0; color: #1e293b; font-size: 22px; text-align: center; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .footer-link {
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .footer-link a { color: #3b82f6; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Rejestracja WeldERP</h3>
        <input type="text" id="username" placeholder="Nowy login">
        <input type="text" id="full_name" placeholder="Imię i nazwisko">
        <input type="password" id="password" placeholder="Hasło">
        <button onclick="register()">Zarejestruj się</button>
    </div>

    <script src="/frontend/js/api.js"></script>
<script>
        async function register() {
            const u = document.getElementById('username').value;
            const fn = document.getElementById('full_name').value;
            const p = document.getElementById('password').value;

            try {
                await WeldERP.request('/register/', WeldERP.json('POST', {username: u, password: p, full_name: fn}));
                alert('Zarejestrowano');
                window.location.href = '/frontend/login.html';
            } catch (error) { alert(error.message); }
        }
    </script>
</body>
</html>
